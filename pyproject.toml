[project]
name = "captionexam"
version = "0.1.0"
description = "A hard, fine-grained caption benchmark: a text-only judge reads the caption and answers questions about the image."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Shichao Song" }]
dependencies = [
    "huggingface_hub>=0.24",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://github.com/Ki-Seki/CaptionExam"
Dataset = "https://huggingface.co/datasets/Ki-Seki/CaptionExam"

[project.scripts]
captionexam = "captionexam.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
